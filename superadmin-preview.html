<!doctype html>
<html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLiZ TV SuperAdmin Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061321;color:#fff;font-family:Arial,sans-serif}header{padding:20px 5%;background:#091c31;border-bottom:1px solid #24465f;display:flex;justify-content:space-between;align-items:center}header b{color:#78ff67;font-size:23px}main{max-width:1100px;margin:auto;padding:20px}.hero{background:linear-gradient(110deg,#07152c,#144566);border:1px solid #376581;border-radius:20px;padding:24px;display:flex;align-items:center;gap:24px}.hero img{width:190px;height:140px;object-fit:contain}.hero h1{color:#82ff6d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:22px 0}button{cursor:pointer;border:1px solid #315a79;background:#14344e;color:white;padding:20px;border-radius:15px;text-align:left;font-size:18px}button:hover{border-color:#82ff6d}button small{display:block;color:#b4cadd;margin-top:9px;font-size:13px}.hidden{display:none!important}#back{background:#264c67;padding:12px;margin-bottom:15px}iframe{border:1px solid #315a79;border-radius:16px;width:100%;height:900px;background:#061321}p{color:#bfd2e0}@media(max-width:600px){.hero{flex-direction:column;text-align:center}.hero img{width:80%}}
</style></head><body><header><b>BLiZ TV</b><span>SUPER ADMIN · PREVIEW</span></header><main>
<section id="home"><div class="hero"><img src="pair-logo.jpg" alt="BLiZ TV"><div><h1>SuperAdmin Control Center</h1><p>Избери категорија за управување</p></div></div>
<div class="grid">
<button data-target="iptvTrialSection">▶ IPTV Trial<small>Генерирај IPTV тест-листа</small></button>
<button data-target="activationSection">🔑 Activation Codes<small>TEST · YEARLY · LIFETIME</small></button>
<button data-target="resellerRows">👥 Resellers<small>Преглед на партнери</small></button>
<button data-target="resellerSelect">💳 Manage Credits<small>Додавање и одземање кредити</small></button>
<button data-target="createResellerSection">➕ Create Reseller<small>Нов партнер</small></button>
<button data-target="historySection">📋 Credit History<small>Историја на кредити</small></button>
</div><p>Тест верзија: оригиналниот SuperAdmin останува непроменет.</p></section>
<button id="back" class="hidden">← Back to Home</button>
<iframe id="admin" src="admin-resellers.html" title="Existing SuperAdmin" loading="eager"></iframe>
</main><script>
const frame=document.getElementById('admin'),home=document.getElementById('home'),back=document.getElementById('back');
function select(id){home.classList.add('hidden');back.classList.remove('hidden');try{const doc=frame.contentDocument;const el=doc.getElementById(id);if(el){el.scrollIntoView({block:'start'});return}}catch(e){}frame.scrollIntoView()}
document.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.target)));
back.addEventListener('click',()=>{home.classList.remove('hidden');back.classList.add('hidden');window.scrollTo(0,0)});
</script></body></html>
